name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      # pull_request only. Fetch origin/<base> deep enough for a merge base, then
      # git diff --name-only origin/<base>...HEAD. Fail with
      # "Bump DEPLOY_SALT in sw.js" when a served or cached file changed and the
      # DEPLOY_SALT line did not.
      - name: Require a DEPLOY_SALT bump when cached files change
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node tests/deploy-salt.test.js --check
